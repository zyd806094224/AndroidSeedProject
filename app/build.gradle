plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    id 'kotlin-kapt'
}

android {
    signingConfigs {
        debug {
            storeFile file('../demo.keystore')
            storePassword '000000dong'
            keyAlias 'demo'
            keyPassword '000000dong'
        }
        release {
            storeFile file('../demo.keystore')
            storePassword '000000dong'
            keyAlias 'demo'
            keyPassword '000000dong'
        }
    }
    compileSdk rootProject.android.compileSdk

    defaultConfig {
        applicationId rootProject.android.applicationId
        minSdk rootProject.android.minSdk
        targetSdk rootProject.android.targetSdk
        versionCode rootProject.android.versionCode
        versionName rootProject.android.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        ndk {
//            abiFilters "armeabi-v7a"
//            abiFilters "arm64-v8a"
////            abiFilters "x86"
//        }
//        externalNativeBuild {
//            cmake {
//                arguments "-DANDROID_STL=c++_shared"
//            }
//        }
        //ARouter
//        javaCompileOptions {
//            annotationProcessorOptions {
//                arguments = [AROUTER_MODULE_NAME: project.getName()]
//            }
//        }
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }

        flavorDimensions "app"
    }

    productFlavors {
        huawei {
            buildConfigField "String", "MODEL", "\"huawei\""
            buildConfigField "boolean", "VA", "false"
        }

        xiaomi {
            buildConfigField "String", "MODEL", "\"xiaomi\""
            buildConfigField "boolean", "VA", "false"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            def flavor = ""
            variant.productFlavors.each { product ->
                flavor = product.name
            }
            if (buildType != "debug") {
                def time = new Date().format("yyyyMMddHHmm", TimeZone.getDefault())
                outputFileName = "Android_${flavor}_V${defaultConfig.versionName}_${buildType}_${time}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }

    //Room官方建议：在`android`块中添加以下代码块，以从软件包中排除原子函数模块并防止出现警告
    packagingOptions {
        exclude 'META-INF/atomicfu.kotlin_module'
    }
}

