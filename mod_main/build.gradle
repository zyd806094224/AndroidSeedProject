plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinAndroid)
    id 'kotlin-kapt'
}
//apply plugin: 'android-aspectjx'

android {
    compileSdk rootProject.android.compileSdk

    defaultConfig {
        minSdk rootProject.android.minSdk
        targetSdk rootProject.android.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        //ARouter
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.coreKtx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.liveDataKtx
    implementation libs.viewModelKtx
    implementation libs.navigationFragment
    implementation libs.navigationUI

    testCompileOnly libs.junit
    androidTestCompileOnly libs.extJunit
    androidTestCompileOnly libs.espressoCore

    implementation libs.gson
    implementation libs.flexbox
    implementation libs.mmkv

    implementation libs.refreshLayout
    implementation libs.refreshHeader
    implementation libs.refreshFooter

    implementation libs.aroutreApi
    kapt libs.arouterCompiler

    implementation libs.tbssdk
    implementation libs.xxPermissions

    implementation project(path: ':lib_framework')
    implementation project(path: ':lib_common')
    implementation project(path: ':lib_network')
    implementation project(path: ':lib_room')
    implementation project(path: ':lib_html')
    implementation project(path: ':lib_universaldialog')
    implementation project(path: ':shared')

    // AOP 切面编程
    implementation libs.aspectjrt
}
